services:
  db:
    image: postgres:16-alpine
    container_name: skillswap-db
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
      POSTGRES_DB: skillswap
    ports:
      - "5432:5432"
    volumes:
      - skillswap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d skillswap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillswap-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://skillswap:skillswap@db:5432/skillswap
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  skillswap_pgdata:
